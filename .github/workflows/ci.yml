name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Phase 7: fail on any high or critical advisory, in runtime or dev dependencies.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # After build: apps resolve @marafiq/shared types from packages/shared/dist.
      # Also covers test files, which the build's tsconfig.build.json excludes.
      - run: npm run typecheck --workspaces --if-present

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results

  e2e-flow:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e:flow
        env:
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/marafiq_e2e
          # The seed wipes this database; it refuses to run without this confirmation.
          E2E_ALLOW_DB_RESET: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-flow-results
          path: apps/web/test-results
